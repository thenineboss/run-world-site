# Keeps the free Supabase project awake: a free project pauses after 7 days without activity.
# Every 3 days GitHub asks the database for the world's km total (a tiny, public question).
#
# Goes in the run-world-site repository on GitHub as .github/workflows/keep-alive.yml,
# with two repository secrets: SUPABASE_URL and SUPABASE_ANON_KEY. See supabase/README.md.
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 3 */3 * *' # every 3 days, 03:17 UTC
  workflow_dispatch:       # and a "Run workflow" button, to test it

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the database for the world total
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # tidy the address: no spaces, no slash at the end
          URL=$(echo "$URL" | tr -d '[:space:]'); URL=${URL%/}; KEY=$(echo "$KEY" | tr -d '[:space:]')
          if ! echo "$URL" | grep -Eq '^https://[a-z0-9]+\.supabase\.co$'; then
            echo "SUPABASE_URL should look like https://abcdefghijklmnop.supabase.co (the Project URL, not the dashboard address)."
            echo "It starts with: $(echo "$URL" | cut -c1-20)..."
            exit 1
          fi
          if [ -z "$KEY" ]; then echo "SUPABASE_ANON_KEY is empty."; exit 1; fi
          code=$(curl -s -o answer.txt -w "%{http_code}" -X POST "$URL/rest/v1/rpc/get_world_total" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{}')
          echo "Supabase answered $code: $(head -c 300 answer.txt)"
          test "$code" = "200"
